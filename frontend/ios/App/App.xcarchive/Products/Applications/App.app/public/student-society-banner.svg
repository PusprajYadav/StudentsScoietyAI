<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" role="img" aria-labelledby="title desc">
  <title id="title">Student Society default banner</title>
  <desc id="desc">Blue and white Student Society banner for student profiles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="48%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="softBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#bfdbfe" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1d4ed8" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="1600" height="400" rx="40" fill="url(#bg)" />

  <circle cx="1400" cy="92" r="132" fill="#dbeafe" opacity="0.8" />
  <circle cx="1490" cy="300" r="92" fill="#bfdbfe" opacity="0.55" />
  <circle cx="118" cy="334" r="162" fill="#dbeafe" opacity="0.55" />
  <path d="M0 298C110 260 222 260 334 298C448 336 560 336 674 298C788 260 900 260 1014 298C1128 336 1240 336 1354 298C1468 260 1548 260 1600 276V400H0Z" fill="#eff6ff" opacity="0.7" />

  <g filter="url(#shadow)">
    <rect x="76" y="66" width="772" height="268" rx="32" fill="#ffffff" fill-opacity="0.82" stroke="#bfdbfe" stroke-width="2" />
  </g>

  <g transform="translate(114 104)">
    <rect x="0" y="0" width="206" height="32" rx="16" fill="url(#softBlue)" />
    <text x="103" y="22" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#2563eb">STUDENT SOCIETY</text>

    <text x="0" y="88" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="900" fill="#0f172a">Free &amp; Safe for Students</text>
    <text x="0" y="138" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="600" fill="#1d4ed8">From Learning to Earning</text>
    <text x="0" y="182" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#475569">Thanks to Creator Mr Puspraj Yadav</text>

    <rect x="0" y="206" width="438" height="4" rx="2" fill="#dbeafe" />
    <rect x="0" y="220" width="360" height="4" rx="2" fill="#bfdbfe" />
  </g>

  <g transform="translate(1050 66)">
    <rect x="0" y="0" width="434" height="268" rx="32" fill="#ffffff" fill-opacity="0.72" stroke="#bfdbfe" stroke-width="2" />

    <circle cx="348" cy="70" r="60" fill="#dbeafe" opacity="0.8" />
    <circle cx="96" cy="210" r="74" fill="#bfdbfe" opacity="0.5" />
    <circle cx="300" cy="206" r="20" fill="#60a5fa" opacity="0.28" />
    <circle cx="336" cy="196" r="10" fill="#2563eb" opacity="0.25" />
    <circle cx="372" cy="214" r="14" fill="#1d4ed8" opacity="0.2" />

    <g transform="translate(84 72)">
      <path d="M130 22L208 52L130 82L52 52Z" fill="#2563eb" fill-opacity="0.14" stroke="#2563eb" stroke-width="5" stroke-linejoin="round" />
      <path d="M130 82V122" stroke="#2563eb" stroke-width="5" stroke-linecap="round" />
      <path d="M100 88V114C100 126 113 136 130 136C147 136 160 126 160 114V88" fill="#dbeafe" stroke="#2563eb" stroke-width="5" stroke-linejoin="round" />
      <circle cx="130" cy="52" r="14" fill="#2563eb" />
      <path d="M210 86C226 98 236 114 238 132" stroke="#93c5fd" stroke-width="8" stroke-linecap="round" />
      <circle cx="240" cy="140" r="8" fill="#2563eb" />
      <path d="M12 162H82" stroke="#93c5fd" stroke-width="8" stroke-linecap="round" />
      <circle cx="100" cy="162" r="6" fill="#1d4ed8" />
      <path d="M258 24C280 34 296 50 306 72" stroke="#dbeafe" stroke-width="8" stroke-linecap="round" />
    </g>
  </g>
</svg>
